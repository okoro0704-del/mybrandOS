[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# Keep browser API calls same-origin while the API remains on Railway.
[[redirects]]
  from = "/api/*"
  to = "https://mybrandos-production.up.railway.app/api/:splat"
  status = 200
  force = true

# React Router deep links (/admin, /admin/*, and public paths) must load the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
