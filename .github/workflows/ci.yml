name: CI

on:
  push:
    branches: [main, "stabilization/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mybrandos
          POSTGRES_PASSWORD: mybrandos
          POSTGRES_DB: mybrandos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mybrandos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mybrandos:mybrandos@localhost:5432/mybrandos?schema=public
      SHADOW_DATABASE_URL: postgresql://mybrandos:mybrandos@localhost:5432/mybrandos_shadow
    steps:
      - uses: actions/checkout@v4

      # Node 22: `node --test test/**/*.test.ts` relies on the test runner's own glob support.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create shadow database
        run: psql "postgresql://mybrandos:mybrandos@localhost:5432/mybrandos" -c "CREATE DATABASE mybrandos_shadow"

      # Same command developers run locally: builds shared + integrations, generates the
      # Prisma client, typechecks the API and the web app.
      - name: Typecheck (root)
        run: npm run typecheck

      - name: Migrations match schema.prisma (no drift)
        run: npm run db:migrate:check

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Generate legacy SQLite client (data-migration tests)
        run: npm run db:generate:legacy -w @mybrandos/api

      # Surface-routing tests serve the built SPA (apps/web/dist), so build it before testing.
      - name: Web production build
        run: npm run build -w @mybrandos/web

      # space-contract-v1 verifies mybrandOS and the LifeOS shell share one Space behavior;
      # it imports ../LifeOS relative to this checkout.
      # The LifeOS side must resolve its OWN vendored @digiconomy/space-runtime (a different
      # build from ours), so install that tarball into the clone (it has no dependencies).
      - name: Check out LifeOS shell (cross-repo Space contract)
        run: |
          LIFEOS="$GITHUB_WORKSPACE/../LifeOS"
          git clone --depth 1 https://github.com/okoro0704-del/LifeOS-Shell-.git "$LIFEOS"
          mkdir -p "$LIFEOS/node_modules/@digiconomy/space-runtime"
          tar -xzf "$LIFEOS/vendor/digiconomy/digiconomy-space-runtime-1.0.0.tgz" --strip-components=1 \
            -C "$LIFEOS/node_modules/@digiconomy/space-runtime"

      # The test script reads apps/api/.env; real env vars above take precedence over it.
      # Same invocation as `npm test`, plus a TAP copy so failures can be surfaced below.
      - name: API tests
        working-directory: apps/api
        run: |
          cp ../../.env.example .env
          npx tsx --env-file=.env --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=api-tests.tap \
            "test/**/*.test.ts"

      # Failing tests (and the pass/fail summary) become check annotations, readable on the
      # PR/commit without opening logs.
      - name: Report test results
        if: always()
        working-directory: apps/api
        run: node ../../scripts/ci-annotate-tap.mjs api-tests.tap

      - name: API build
        run: npm run build -w @mybrandos/api

  # Builds the real production image and runs it (NODE_ENV=production) against PostgreSQL.
  # Remote primitives are replaced by scripts/ci/fake-primitives.mjs; nothing in the image changes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mybrandos
          POSTGRES_PASSWORD: mybrandos
          POSTGRES_DB: mybrandos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mybrandos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mybrandos:mybrandos@127.0.0.1:5432/mybrandos?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production image
        run: docker build -f apps/api/Dockerfile -t mybrandos-api:ci .

      - name: Production environment for the container
        run: |
          {
            echo "COOKIE_SECRET=$(openssl rand -hex 32)"
            echo "PRIMITIVES_MODE=remote"
            echo "TRUSTID_API=http://127.0.0.1:4900"
            echo "DATAZONE_API_URL=http://127.0.0.1:4900"
            echo "DATAZONE_API_KEY=ci-fake-key"
            echo "DATAZONE_BOUND=true"
            echo "PLATFORM_JOBS_URL=http://127.0.0.1:4900"
            echo "PLATFORM_JOBS_TOKEN=ci-fake-token"
            echo "CORS_ORIGINS=https://ci.invalid"
            echo "PORT=8793"
            echo "UPLOAD_MAX_FILE_BYTES=1048576"
          } > /tmp/api.env

      - name: Entrypoint refuses a non-PostgreSQL DATABASE_URL
        run: |
          set +e
          out=$(docker run --rm --env-file /tmp/api.env -e DATABASE_URL=file:/app/apps/api/data/prod.db mybrandos-api:ci 2>&1)
          code=$?
          echo "$out"
          test $code -ne 0 && echo "$out" | grep -q "must be a PostgreSQL URL"

      - name: API refuses to start against an unmigrated database
        run: |
          set +e
          out=$(docker run --rm --network host --env-file /tmp/api.env -e DATABASE_URL="$DATABASE_URL" mybrandos-api:ci 2>&1)
          code=$?
          echo "$out" | tail -5
          test $code -ne 0 && echo "$out" | grep -q "no migration history"

      # Mirrors the Railway pre-deploy command: migrations run explicitly, not at app start.
      - name: Pre-deploy migrations (prisma migrate deploy, from the image)
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" mybrandos-api:ci npx prisma migrate deploy

      - name: Start fake primitives and the production container
        run: |
          node scripts/ci/fake-primitives.mjs 4900 > /tmp/fake.log 2>&1 &
          docker run -d --name api --network host --env-file /tmp/api.env -e DATABASE_URL="$DATABASE_URL" mybrandos-api:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8793/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8793/health
          docker logs api 2>&1 | grep -q '"msg":"migrations verified"'

      - name: Runtime smoke (health, auth, reads, comments, loves, views, uploads, schedules, rate limits)
        env:
          BASE: http://127.0.0.1:8793
          FAKE: http://127.0.0.1:4900
        run: |
          node scripts/ci/smoke-container.mjs > /tmp/smoke.txt 2>&1 || true
          cat /tmp/smoke.txt
          while read -r line; do
            case "$line" in FAIL*) echo "::error title=Docker smoke::${line}";; PASS*) echo "::notice title=Docker smoke::${line}";; esac
          done < /tmp/smoke.txt
          test "$(grep -c '^PASS' /tmp/smoke.txt)" = "8" && test "$(grep -c '^FAIL' /tmp/smoke.txt)" = "0"

      - name: Upload spool is empty after all uploads
        run: test "$(docker exec api sh -c 'ls -A /tmp/mybrandos-uploads 2>/dev/null | wc -l')" = "0"

      - name: No unexpected server errors
        run: |
          docker logs api > /tmp/api.log 2>&1
          if grep -E '"level":50' /tmp/api.log | grep -vE 'scheduled publish failed' ; then echo "::error title=Docker smoke::server logged errors"; exit 1; fi

      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -80 || true
